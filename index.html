<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>购物清单</title>
<!-- 一周三餐 · 手机购物页 / Weekly Meals · phone shopping list
     短链接 ?l=<编号>#k=<钥匙>：清单加密后放在本仓库 lists/<编号>.json，钥匙只在 # 后面，只在打开的手机上解密。
     压缩链接 #z=…，旧链接 #d=…：清单直接写在 # 后面。导出的文件：清单在 window.SHOPPING_DATA 里。 -->
<style>
:root{--bg:#F3F5F1;--card:#fff;--ink:#1C2520;--muted:#5D6A62;--line:#D9E0DA;--accent:#1E6A51;--accent-ink:#fff;--done:#8C978F;--warn:#C2601A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111613;--card:#19201C;--ink:#E5EBE7;--muted:#9AA79F;--line:#2B3530;--accent:#63C29C;--accent-ink:#0B1712;--done:#68756D;--warn:#F0995A;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;padding:0 14px calc(28px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 2px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;margin:0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--card);color:var(--muted);font:inherit;font-size:13px;padding:4px 11px;cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.sum{margin-top:6px;font-size:15px;font-weight:600}
.sum b{color:var(--accent);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:16px;margin-top:14px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h2{margin:0 2px;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.grp h2 .n{font-weight:400}
.grp.done h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.it{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.it input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.tk{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.tk::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);opacity:0}
.it input:focus-visible+.tk{outline:2px solid var(--accent);outline-offset:2px}
.nm{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.qt{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.nt{grid-column:2/4;color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.nt .short{color:var(--warn)}
.it.on{background:transparent}
.it.on .tk{background:var(--accent);border-color:var(--accent)}
.it.on .tk::after{opacity:1}
.it.on .nm,.it.on .qt{text-decoration:line-through;color:var(--done)}
.tabs{display:flex;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tabs button{flex:1;border:0;background:var(--card);color:var(--muted);font:inherit;font-size:15px;padding:8px 6px;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;scroll-margin-top:150px}
.day h2{margin:0;padding:10px 14px 8px;font-size:16px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.day h2 .dt{color:var(--muted);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.day h2 .tag{margin-left:auto;align-self:center;font-size:12px;font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 9px}
.day.today{border:2px solid var(--accent)}
.day.weekend h2 .dn{color:var(--accent)}
.meal{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:9px 14px;align-items:baseline}
.meal+.meal{border-top:1px dashed var(--line)}
.meal .ml{font-size:13px;font-weight:700;border-left:4px solid var(--mc);padding-left:8px;color:var(--ink)}
.meal .ds{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.meal .d{background:var(--mb);border-radius:6px;padding:1px 8px;font-size:15px;overflow-wrap:anywhere}
.meal .none{color:var(--done);font-size:14px}
.m-b{--mc:#B57A0A;--mb:#FAF0D8}.m-l{--mc:#4F8A35;--mb:#E5F0DC}.m-d{--mc:#3C4C93;--mb:#E2E6F4}
@media (prefers-color-scheme:dark){.m-b{--mc:#E9B949;--mb:#2F2713}.m-l{--mc:#8DC46E;--mb:#1E2B18}.m-d{--mc:#93A1EA;--mb:#1D2240}}
.ok{margin-top:12px;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center}
footer{margin-top:20px;display:flex;flex-direction:column;gap:8px}
button.big{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px;width:100%;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
textarea{width:100%;min-height:120px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink)}
.hint{color:var(--muted);font-size:12px;text-align:center}
.err{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1 id="title">购物清单</h1>
    <span class="lang" role="group" aria-label="语言 / Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </span>
  </div>
  <div class="meta" id="meta"></div>
  <div class="sum" id="sum" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" id="tab-list" data-tab="list" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-menu" data-tab="menu" aria-selected="false"></button>
  </nav>
</header>
<main id="list"></main>
<main id="menu" hidden></main>
<div class="ok" id="ok" hidden></div>
<div class="err" id="err" hidden></div>
<footer id="foot" hidden>
  <button type="button" class="big primary" id="copy"></button>
  <textarea id="res" hidden readonly></textarea>
  <div class="hint" id="hint"></div>
</footer>
<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }

  // ---------- 文字 / strings ----------
  var CATS = ["蔬菜", "菌菇", "水果", "肉类", "禽肉", "水产", "蛋奶", "豆制品", "主食", "调料", "干货", "其他"];
  var CAT_EN = { "蔬菜": "Vegetables", "菌菇": "Mushrooms", "水果": "Fruit", "肉类": "Meat", "禽肉": "Poultry", "水产": "Seafood",
    "蛋奶": "Eggs & dairy", "豆制品": "Soy products", "主食": "Staples", "调料": "Seasonings", "干货": "Dry goods", "其他": "Other" };
  var MONTHS_EN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var T = {
    zh: {
      title: "购物清单", menuTitle: "每日菜单", tabList: "购物清单", tabMenu: "每日菜单", today: "今天", noDish: "—",
      days: ["周六", "周日", "周一", "周二", "周三", "周四", "周五"], meals: ["早餐", "午餐", "晚餐"],
      noMenu: "这个链接里没有菜单。请让家里在「一周三餐」里重新点「生成微信链接」再发一次。", loading: "正在读取清单…", people: "{n} 人", sent: "发出于 {d}", sum: "还要买 <b>{a}</b> 项 · 已买 <b>{b}</b> 项",
      servings: "{n} 人份", usesFor: "用于 {list}", atHome: "家里还有 {x}", some: "一些", sep: "、", other: "其他",
      doneHead: "已买（{n}）· 点一下可以撤回", allDone: "全部买齐了", copy: "复制购买结果（发回给家里）", copied: "已复制，到微信里粘贴发回去",
      copyManual: "长按上面的文字全选、复制，发回给家里", hint: "点一项就算买好了，会移到下面「已买」；再点一下可以撤回。勾选记录保存在这台手机上，关掉再打开还在。",
      resultTitle: "购物结果 {range}", resultBought: "已买（{n}）：{list}", resultNot: "没买到（{n}）：{list}", none: "无", empty: "这一周没有要买的东西。",
      uploading: "清单还在上传，稍等几秒自动刷新…",
      errOld: "这个手机浏览器的版本太旧，打不开这个清单。请把整条链接复制到手机自带的浏览器里打开。",
      errNoKey: "链接后半段（# 后面的部分）丢了，读不出清单。请把对方发来的整条链接复制到浏览器里打开，或者让家里重新发一次。",
      errNotFound: "没找到这份清单。可能还没上传完，请过一分钟再打开；还是不行就让家里重新生成链接。",
      errBad: "这个链接不完整，读不出清单。请让家里在「一周三餐」里重新点「生成微信链接」再发一次。"
    },
    en: {
      title: "Shopping list", menuTitle: "Daily menu", tabList: "Shopping list", tabMenu: "Daily menu", today: "Today", noDish: "—",
      days: ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"], meals: ["Breakfast", "Lunch", "Dinner"],
      noMenu: "This link doesn’t include the menu. Ask for a new link from the meal planner.", loading: "Loading the list…", people: "{n} people", sent: "sent {d}", sum: "To buy <b>{a}</b> · Bought <b>{b}</b>",
      servings: "{n} servings", usesFor: "For {list}", atHome: "At home: {x}", some: "some", sep: ", ", other: "Other",
      doneHead: "Bought ({n}) · tap to undo", allDone: "Everything’s bought", copy: "Copy result (send it back home)", copied: "Copied — paste it into WeChat to send back",
      copyManual: "Press and hold the text above, select all, copy and send it back", hint: "Tap an item once it’s in your basket — it moves down to “Bought”. Tap again to undo. Ticks are saved on this phone, even if you close the page.",
      resultTitle: "Shopping result {range}", resultBought: "Bought ({n}): {list}", resultNot: "Not bought ({n}): {list}", none: "none", empty: "Nothing to buy this week.",
      uploading: "The list is still uploading — this refreshes in a few seconds…",
      errOld: "This phone’s browser is too old to open the list. Copy the whole link into the phone’s own browser.",
      errNoKey: "The end of the link (after #) is missing, so the list can’t be read. Copy the whole link into a browser, or ask for it to be sent again.",
      errNotFound: "This list wasn’t found. It may still be uploading — try again in a minute, or ask for a new link.",
      errBad: "This link is incomplete and the list can’t be read. Ask for a new link from the meal planner.",
      servings_1: "1 serving", people_1: "1 person"
    }
  };
  var LANG = "zh";
  function tr(k, v) {
    if (LANG === "en" && v && Number(v.n) === 1 && T.en[k + "_1"] != null) k = k + "_1";
    var s = T[LANG][k] != null ? T[LANG][k] : T.zh[k];
    return v ? s.replace(/\{(\w+)\}/g, function (_, x) { return v[x] != null ? v[x] : ""; }) : s;
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return String(Math.round(n * 100) / 100); }

  // ---------- 读清单 / decode ----------
  var AL = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
  function unb62(str) {
    var n = BigInt(0), b62 = BigInt(62);
    for (var i = 0; i < str.length; i++) {
      var v = AL.indexOf(str.charAt(i));
      if (v < 0) throw new Error("bad char");
      n = n * b62 + BigInt(v);
    }
    var hex = n.toString(16);
    if (hex.length % 2) hex = "0" + hex;
    var bytes = new Uint8Array(hex.length / 2);
    for (var j = 0; j < bytes.length; j++) bytes[j] = parseInt(hex.substr(j * 2, 2), 16);
    return bytes.subarray(1);
  }
  function utf8(bytes) {
    if (window.TextDecoder) return new TextDecoder().decode(bytes);
    var bin = ""; for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return decodeURIComponent(escape(bin));
  }
  function fromB64(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function inflate(bytes) {
    if (!window.DecompressionStream) return Promise.reject(new Error("old"));
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Response(stream).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  function fetchList(id) {
    var owner = location.hostname.split(".")[0], repo = location.pathname.split("/")[1] || "";
    var urls = ["https://raw.githubusercontent.com/" + owner + "/" + repo + "/main/lists/" + id + ".json", "lists/" + id + ".json"];
    function tryAt(i) {
      if (i >= urls.length) return Promise.reject(new Error("notfound"));
      return fetch(urls[i] + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      }).catch(function () { return tryAt(i + 1); });
    }
    return tryAt(0);
  }
  function decrypt(blob, key) {
    if (!(window.crypto && crypto.subtle)) return Promise.reject(new Error("old"));
    return crypto.subtle.importKey("raw", key, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(blob.iv) }, k, fromB64(blob.ct));
    }).then(function (buf) { return JSON.parse(utf8(new Uint8Array(buf))); });
  }

  // ---------- 状态 / state ----------
  var data = null, items = [], st = {}, KEY = "", errKey = "", TAB = stored("gouwu-tab") === "menu" ? "menu" : "list", scrolledToday = false;
  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 存不了也能用 */ } }

  // 统一成 { name, qty, cat, uses, left } 。v2 是结构化的；v1（旧链接）里数量和「用于」是现成的中文
  function normalize(d) {
    return d.i.map(function (row, k) {
      if (Array.isArray(row)) return { k: k, name: String(row[0] || ""), qtyText: String(row[1] || ""), cat: String(row[2] || ""), usesText: String(row[3] || ""), left: row[4] ? String(row[4]) : null };
      return { k: k, name: String(row.n || ""), q: row.q, u: row.u || "", s: row.s || 0, cat: row.c || "", dl: row.dl || [], left: row.l };
    });
  }
  function qty(it) {
    if (it.qtyText != null) return it.qtyText;
    var a = it.q != null ? fmt(it.q) + (it.u ? " " + it.u : "") : "";
    if (it.s) a += (a ? " + " : "") + tr("servings", { n: it.s });
    return a;
  }
  function note(it) {
    var home = it.left != null ? '<span class="short">' + esc(tr("atHome", { x: it.left || tr("some") })) + "</span> · " : "";
    if (it.usesText != null) return home + esc(it.usesText);
    return home + esc(it.dl.length ? tr("usesFor", { list: it.dl.join(tr("sep")) }) : "");
  }
  function catLabel(c) { return LANG === "en" ? (CAT_EN[c] || c || tr("other")) : (c || tr("other")); }
  function md(dt) { return LANG === "en" ? MONTHS_EN[dt.getMonth()] + " " + dt.getDate() : (dt.getMonth() + 1) + "月" + dt.getDate() + "日"; }
  function range() {
    if (data.w) {
      var p = data.w.split("-").map(Number), a = new Date(p[0], p[1] - 1, p[2]), b = new Date(p[0], p[1] - 1, p[2] + 6);
      return md(a) + "–" + md(b);
    }
    return data.t || "";
  }

  // ---------- 每日菜单 / daily menu ----------
  function weekStart() {
    if (!data || !data.w) return null;
    var p = data.w.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function renderMenu() {
    if (!Array.isArray(data.m)) { $("menu").innerHTML = '<p class="meta">' + esc(tr("noMenu")) + "</p>"; return; }
    var start = weekStart(), now = new Date(), h = "";
    for (var d = 0; d < 7; d++) {
      var dt = start ? new Date(start.getFullYear(), start.getMonth(), start.getDate() + d) : null;
      var isToday = dt && dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth() && dt.getDate() === now.getDate();
      h += '<section class="day' + (d < 2 ? " weekend" : "") + (isToday ? " today" : "") + '"' + (isToday ? ' id="today"' : "") + ">" +
        '<h2><span class="dn">' + esc(tr("days")[d]) + "</span>" + (dt ? '<span class="dt">' + (dt.getMonth() + 1) + "/" + dt.getDate() + "</span>" : "") +
        (isToday ? '<em class="tag">' + esc(tr("today")) + "</em>" : "") + "</h2>";
      ["b", "l", "d"].forEach(function (k, mi) {
        var dishes = (data.m[d] && data.m[d][mi]) || [];
        h += '<div class="meal m-' + k + '"><span class="ml">' + esc(tr("meals")[mi]) + '</span><span class="ds">' +
          (dishes.length ? dishes.map(function (n) { return '<span class="d">' + esc(n) + "</span>"; }).join("") : '<span class="none">' + esc(tr("noDish")) + "</span>") +
          "</span></div>";
      });
      h += "</section>";
    }
    $("menu").innerHTML = h;
  }

  // ---------- 显示 / render ----------
  function itemHtml(it) {
    var on = !!st[it.k];
    return '<label class="it' + (on ? " on" : "") + '"><input type="checkbox" data-k="' + it.k + '"' + (on ? " checked" : "") + '>' +
      '<span class="tk" aria-hidden="true"></span><span class="nm">' + esc(it.name) + '</span><span class="qt">' + esc(qty(it)) + "</span>" +
      '<span class="nt">' + note(it) + "</span></label>";
  }
  function render() {
    document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
    Array.prototype.forEach.call(document.querySelectorAll(".lang button"), function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === LANG)); });
    $("title").textContent = tr(TAB === "menu" && data && Array.isArray(data.m) ? "menuTitle" : "title");
    if (!data) { if (errKey) { $("err").textContent = tr(errKey); $("err").hidden = false; $("meta").textContent = ""; } else $("meta").textContent = tr("loading"); return; }
    document.title = tr(TAB === "menu" && Array.isArray(data.m) ? "menuTitle" : "title") + " " + range();
    $("meta").textContent = [range(), data.p ? tr("people", { n: data.p }) : "", data.d ? tr("sent", { d: data.d }) : ""].filter(Boolean).join(" · ");
    var todo = items.filter(function (it) { return !st[it.k]; }), done = items.filter(function (it) { return st[it.k]; });
    $("sum").innerHTML = tr("sum", { a: todo.length, b: done.length });
    $("sum").hidden = false;
    // 没买的按类别分组（类别顺序跟家里的清单一致），买好的放到最下面
    var groups = {}, order = [];
    todo.forEach(function (it) { if (!groups[it.cat]) { groups[it.cat] = []; order.push(it.cat); } groups[it.cat].push(it); });
    order.sort(function (a, b) { var x = CATS.indexOf(a), y = CATS.indexOf(b); return (x < 0 ? 99 : x) - (y < 0 ? 99 : y); });
    var h = order.map(function (c) {
      return '<section class="grp"><h2>' + esc(catLabel(c)) + ' <span class="n">' + groups[c].length + "</span></h2>" + groups[c].map(itemHtml).join("") + "</section>";
    }).join("");
    if (done.length) h += '<section class="grp done"><h2>' + esc(tr("doneHead", { n: done.length })) + "</h2>" + done.map(itemHtml).join("") + "</section>";
    if (!items.length) h = '<p class="meta">' + esc(tr("empty")) + "</p>";
    $("list").innerHTML = h;
    $("ok").textContent = tr("allDone");
    $("ok").hidden = !(items.length && !todo.length);
    $("copy").textContent = tr("copy");
    $("hint").textContent = tr("hint");
    $("res").hidden = true;
    // 标签：旧链接里没有菜单，就不显示「每日菜单」
    var hasMenu = Array.isArray(data.m);
    if (!hasMenu) TAB = "list";
    $("tabs").hidden = !hasMenu;
    $("tab-list").textContent = tr("tabList");
    $("tab-menu").textContent = tr("tabMenu");
    $("tab-list").setAttribute("aria-selected", String(TAB === "list"));
    $("tab-menu").setAttribute("aria-selected", String(TAB === "menu"));
    var onList = TAB === "list";
    $("list").hidden = !onList; $("sum").hidden = !onList; $("foot").hidden = !onList;
    $("ok").hidden = !onList || !(items.length && !todo.length);
    $("menu").hidden = onList;
    if (!onList) {
      renderMenu();
      if (!scrolledToday && $("today")) { scrolledToday = true; $("today").scrollIntoView({ block: "start" }); }
    }
  }

  document.addEventListener("change", function (ev) {
    var k = ev.target && ev.target.getAttribute("data-k");
    if (k == null) return;
    st[k] = ev.target.checked;
    store(KEY, JSON.stringify(st));
    render();
  });
  document.addEventListener("click", function (ev) {
    var tb = ev.target.closest && ev.target.closest(".tabs button");
    if (tb) {
      TAB = tb.getAttribute("data-tab") === "menu" ? "menu" : "list";
      store("gouwu-tab", TAB);
      render();
      if (TAB === "list") window.scrollTo(0, 0);
      return;
    }
    var b = ev.target.closest && ev.target.closest(".lang button");
    if (!b) return;
    LANG = b.getAttribute("data-lang") === "en" ? "en" : "zh";
    store("gouwu-lang", LANG);
    render();
  });
  $("copy").addEventListener("click", function () {
    var got = [], no = [];
    items.forEach(function (it) { (st[it.k] ? got : no).push(it.name); });
    var text = tr("resultTitle", { range: range() }) + "\n" +
      tr("resultBought", { n: got.length, list: got.join(tr("sep")) || tr("none") }) + "\n" +
      tr("resultNot", { n: no.length, list: no.join(tr("sep")) || tr("none") });
    var box = $("res"), btn = $("copy");
    function show() { box.value = text; box.hidden = false; box.focus(); box.select(); btn.textContent = tr("copyManual"); }
    try { navigator.clipboard.writeText(text).then(function () { btn.textContent = tr("copied"); }, show); } catch (e) { show(); }
  });

  // ---------- 启动 / boot ----------
  var q = {}, h = {};
  location.search.replace(/^\?/, "").split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) q[p[0]] = p[1] || ""; });
  location.hash.replace(/^#/, "").split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) h[p[0]] = p[1] || ""; });
  var savedLang = stored("gouwu-lang");
  LANG = savedLang === "en" || savedLang === "zh" ? savedLang : (/^zh/i.test(navigator.language || "zh") ? "zh" : "en");
  render();

  var load;
  if (window.SHOPPING_DATA) {
    load = Promise.resolve(window.SHOPPING_DATA);
  } else if (q.l && h.k) {
    var tries = 0;
    load = (function attempt() {
      return fetchList(q.l).catch(function (e) {
        if (++tries > 12) throw e;
        $("meta").textContent = tr("uploading");
        return new Promise(function (r) { setTimeout(r, 10000); }).then(attempt);
      });
    })().then(function (blob) { return decrypt(blob, unb62(h.k)); });
  } else if (h.z) {
    load = inflate(unb62(h.z)).then(function (b) { return JSON.parse(utf8(b)); });
  } else if (h.d) {
    load = Promise.resolve().then(function () { return JSON.parse(utf8(fromB64(h.d))); });
  } else {
    load = Promise.reject(new Error(q.l ? "nokey" : "empty"));
  }
  load.then(function (d) {
    if (!d || !Array.isArray(d.i)) throw new Error("bad");
    data = d;
    items = normalize(d);
    KEY = "gouwu-" + String(d.id || q.l || "");
    try { st = JSON.parse(stored(KEY) || "{}") || {}; } catch (e) { st = {}; }
    if (!savedLang && (d.lang === "en" || d.lang === "zh")) LANG = d.lang;   // 第一次打开时跟发送人的语言一样
    render();
  }).catch(function (e) {
    var m = String(e && e.message);
    errKey = m === "old" ? "errOld" : m === "nokey" ? "errNoKey" : m === "notfound" ? "errNotFound" : "errBad";
    render();
  });
})();
</script>
</body>
</html>
